<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TD Canada Trust - Mobile Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font - Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tdGreen: {
              DEFAULT: '#008a00',
              dark: '#006b00',
              light: '#f2f8f2',
              pill: '#ffffff',
            },
            tdGray: {
              bg: '#f4f6f8',
              card: '#ffffff',
              border: '#e5e7eb',
              text: '#111827',
              subtext: '#6b7280'
            }
          },
          fontFamily: {
            sans: ['Inter', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', Arial, sans-serif;
      background-color: #f4f6f8;
      color: #111827;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-16">

  <!-- LOADING OVERLAY -->
  <div id="loading-overlay" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center space-y-3 transition-opacity duration-300">
    <div class="w-10 h-10 border-4 border-tdGreen border-t-transparent rounded-full animate-spin"></div>
    <p class="text-xs font-semibold text-gray-600">Loading secure session...</p>
  </div>

  <!-- TOP GREEN APP HEADER SECTION -->
  <header class="bg-tdGreen text-white pt-3 pb-6 px-4 shadow-md rounded-b-2xl">
    <div class="max-w-md mx-auto space-y-4">
      
      <!-- Top Row -->
      <div class="flex items-center justify-between pt-1">
        <div class="w-8"></div>
        
        <!-- Banking / Investing Toggle -->
        <div class="bg-black/20 p-1 rounded-full flex items-center space-x-1">
          <button class="bg-white text-gray-900 font-bold text-xs px-4 py-1.5 rounded-full shadow-sm">Banking</button>
          <button class="text-white hover:bg-white/10 font-medium text-xs px-4 py-1.5 rounded-full transition-colors">Investing</button>
        </div>

        <!-- Mail Inbox Icon -->
        <button class="relative p-1.5 rounded-full hover:bg-white/10 transition-colors" title="Messages">
          <i class="fa-regular fa-envelope text-lg"></i>
          <span class="absolute top-1 right-1 bg-red-500 text-white text-[9px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center">1</span>
        </button>
      </div>

      <!-- Greeting Row -->
      <div class="flex items-center justify-between pt-2">
        <div>
          <p class="text-xs text-green-100 font-medium" id="greeting-time">Good morning,</p>
          <h1 class="text-2xl font-extrabold tracking-tight" id="user-display-name">Valued Customer</h1>
        </div>
        <img src="../images/cdic-logo-white-en.png" alt="TD Logo" class="h-6 w-auto opacity-90">
      </div>

      <!-- Horizontal Scrollable Quick Action Pills -->
      <div class="flex space-x-2.5 overflow-x-auto no-scrollbar pt-2 pb-1">
        <button onclick="quickAction('Send Money')" class="flex items-center space-x-2 bg-white text-gray-800 font-semibold text-xs px-3.5 py-2 rounded-full whitespace-nowrap shadow-sm hover:bg-gray-50 active:scale-95 transition-all">
          <i class="fa-solid fa-paper-plane text-tdGreen"></i>
          <span>Send Money</span>
        </button>
        <button onclick="quickAction('Transfer')" class="flex items-center space-x-2 bg-white text-gray-800 font-semibold text-xs px-3.5 py-2 rounded-full whitespace-nowrap shadow-sm hover:bg-gray-50 active:scale-95 transition-all">
          <i class="fa-solid fa-arrow-right-arrow-left text-tdGreen"></i>
          <span>Transfer</span>
        </button>
        <button onclick="quickAction('Pay Bill')" class="flex items-center space-x-2 bg-white text-gray-800 font-semibold text-xs px-3.5 py-2 rounded-full whitespace-nowrap shadow-sm hover:bg-gray-50 active:scale-95 transition-all">
          <i class="fa-solid fa-file-invoice-dollar text-tdGreen"></i>
          <span>Pay Bill</span>
        </button>
        <button onclick="quickAction('Deposit Cheque')" class="flex items-center space-x-2 bg-white text-gray-800 font-semibold text-xs px-3.5 py-2 rounded-full whitespace-nowrap shadow-sm hover:bg-gray-50 active:scale-95 transition-all">
          <i class="fa-solid fa-camera text-tdGreen"></i>
          <span>Deposit Cheque</span>
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="max-w-md mx-auto px-4 py-5 flex-grow w-full space-y-6">

    <!-- SECTION: MY ACCOUNTS -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <a href="#" class="text-lg font-bold text-gray-900 hover:text-tdGreen flex items-center space-x-1">
          <span>My Accounts</span>
          <i class="fa-solid fa-chevron-right text-xs text-tdGreen"></i>
        </a>
        <button onclick="toggleBalances()" class="text-gray-400 hover:text-gray-600">
          <i class="fa-solid fa-ellipsis" id="balance-toggle-icon"></i>
        </button>
      </div>

      <!-- BANKING GROUP CARD -->
      <div class="bg-white rounded-2xl border border-gray-200/80 p-4 shadow-sm hover:shadow-md transition-shadow">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-base font-bold text-gray-900">Banking</h2>
            <p class="text-xs text-gray-500 font-medium">1 account</p>
          </div>
          <div class="text-right flex items-center space-x-2">
            <div class="text-lg font-extrabold text-gray-900 balance-text" id="banking-balance" data-balance="\$2,428.52">\$2,428.52</div>
            <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
          </div>
        </div>
      </div>

      <!-- CREDIT GROUP CARD -->
      <div class="bg-white rounded-2xl border border-gray-200/80 p-4 shadow-sm hover:shadow-md transition-shadow">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-base font-bold text-gray-900">Credit</h2>
            <p class="text-xs text-gray-500 font-medium">1 account</p>
          </div>
          <div class="text-right flex items-center space-x-2">
            <div class="text-lg font-extrabold text-gray-900 balance-text" id="credit-balance" data-balance="\$2,656.77">\$2,656.77</div>
            <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
          </div>
        </div>
      </div>

      <!-- INVESTING GROUP CARD -->
      <div class="bg-white rounded-2xl border border-gray-200/80 p-4 shadow-sm hover:shadow-md transition-shadow">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-base font-bold text-gray-900">Investing</h2>
            <p class="text-xs text-gray-500 font-medium">1 account</p>
          </div>
          <div class="text-right flex items-center space-x-2">
            <div class="text-lg font-extrabold text-gray-900 balance-text" id="investing-balance" data-balance="\$7,844.25">\$7,844.25</div>
            <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
          </div>
        </div>
      </div>
    </section>

    <!-- ACTION TOAST -->
    <div id="action-toast" class="hidden p-3 bg-gray-900 text-white text-xs rounded-xl shadow-lg flex items-center space-x-2">
      <i class="fa-solid fa-circle-info text-tdGreen"></i>
      <span id="toast-message">Action requested</span>
    </div>

  </main>

  <!-- BOTTOM MOBILE NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-2 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center text-[10px] text-gray-500 font-medium">
      <a href="dashboard.html" class="flex flex-col items-center text-tdGreen font-bold space-y-1">
        <i class="fa-solid fa-house text-lg"></i>
        <span>Home</span>
      </a>
      <a href="accounts.html" class="flex flex-col items-center hover:text-tdGreen space-y-1">
        <i class="fa-solid fa-wallet text-lg"></i>
        <span>Accounts</span>
      </a>
      <a href="move.html" class="flex flex-col items-center hover:text-tdGreen space-y-1">
        <i class="fa-solid fa-arrows-up-down-left-right text-lg"></i>
        <span>Move</span>
      </a>
      <a href="rewards.html" class="flex flex-col items-center hover:text-tdGreen space-y-1">
        <i class="fa-solid fa-gift text-lg"></i>
        <span>Rewards</span>
      </a>
      <button onclick="handleLogout()" class="flex flex-col items-center hover:text-red-600 space-y-1">
        <i class="fa-solid fa-bars text-lg"></i>
        <span>More</span>
      </button>
    </div>
  </nav>

  <!-- FIREBASE AUTH & FIRESTORE SCRIPT -->
  <script type="module">
    import { auth } from '../firebase.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      onSnapshot, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(auth.app);
    let balancesHidden = false;

    // Helper to hide overlay safely
    function hideLoadingOverlay() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.classList.add('hidden');
      }
    }

    // Helper to format currency numbers
    const formatCurrency = (val) => `$${Number(val || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

    // Helper to extract default display name from email/username
    function getDefaultDisplayName(user) {
      if (user.displayName) return user.displayName;
      if (user.email) {
        const usernamePart = user.email.split('@')[0];
        return usernamePart.charAt(0).toUpperCase() + usernamePart.slice(1);
      }
      return "Valued Customer";
    }

    // 1. ROUTE AUTHENTICATION: Ensure user is signed in
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // Unauthenticated -> Redirect to login page
        window.location.href = '../login.html';
      } else {
        await initDashboard(user);
      }
    });

    // 2. FETCH DATA FROM USERS COLLECTION
    async function initDashboard(user) {
      // Set greeting based on time of day
      const hour = new Date().getHours();
      let greeting = 'Good morning,';
      if (hour >= 12 && hour < 17) greeting = 'Good afternoon,';
      else if (hour >= 17) greeting = 'Good evening,';
      document.getElementById('greeting-time').innerText = greeting;

      const fallbackName = getDefaultDisplayName(user);
      document.getElementById('user-display-name').innerText = fallbackName;

      const userRef = doc(db, "users", user.uid);

      try {
        // Initialize default document if user record does not exist in Firestore yet
        const snap = await getDoc(userRef);
        if (!snap.exists()) {
          await setDoc(userRef, {
            fullName: fallbackName,
            balanceBanking: 2428.52,
            balanceCredit: 2656.77,
            balanceInvesting: 7844.25
          }).catch(err => console.warn("Firestore setDoc permitted/warning:", err));
        }

        // Realtime listener for users collection document
        onSnapshot(userRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();

            // Set Full Name
            const fullName = data.fullName || fallbackName;
            document.getElementById('user-display-name').innerText = fullName;

            // 1. balanceBanking
            const bankingVal = formatCurrency(data.balanceBanking);
            const bankingEl = document.getElementById('banking-balance');
            bankingEl.innerText = balancesHidden ? '••••••••' : bankingVal;
            bankingEl.setAttribute('data-balance', bankingVal);

            // 2. balanceCredit
            const creditVal = formatCurrency(data.balanceCredit);
            const creditEl = document.getElementById('credit-balance');
            creditEl.innerText = balancesHidden ? '••••••••' : creditVal;
            creditEl.setAttribute('data-balance', creditVal);

            // 3. balanceInvesting
            const investingVal = formatCurrency(data.balanceInvesting);
            const investingEl = document.getElementById('investing-balance');
            investingEl.innerText = balancesHidden ? '••••••••' : investingVal;
            investingEl.setAttribute('data-balance', investingVal);
          }

          // Hide loading screen once data loads
          hideLoadingOverlay();
        }, (err) => {
          console.error("Firestore listener error:", err);
          hideLoadingOverlay();
        });

      } catch (err) {
        console.error("Firestore initialization error:", err);
        // Fallback: hide loading screen so user isn't locked out on database error
        hideLoadingOverlay();
      }
    }

    // Toggle balance privacy mask (••••••••)
    window.toggleBalances = function() {
      balancesHidden = !balancesHidden;
      document.querySelectorAll('.balance-text').forEach(el => {
        if (balancesHidden) {
          el.innerText = '••••••••';
        } else {
          el.innerText = el.getAttribute('data-balance') || '\$0.00';
        }
      });
    }

    window.quickAction = function(action) {
      const toast = document.getElementById('action-toast');
      const msg = document.getElementById('toast-message');
      msg.innerText = `Opening ${action}...`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    // Logout handler
    window.handleLogout = async function() {
      try {
        await signOut(auth);
        window.location.href = '../login.html';
      } catch (e) {
        console.error("Sign out error:", e);
      }
    }
  </script>
</body>
</html>
