<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Dashboard — Create User</title>

<!-- Firebase SDK Compat Scripts -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="td-theme.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;}
.card{background:#fff;border-radius:24px;padding:32px;border:1px solid #f1f5f9;box-shadow:0 4px 24px rgba(0,0,0,0.06);width:100%;max-width:540px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#6366f1,#8b5cf6,#ec4899);}
.inp{width:100%;padding:14px 18px;border-radius:16px;background:#f8fafc;border:2px solid #e2e8f0;color:#1e293b;font-size:15px;font-weight:600;outline:none;transition:all 0.3s;}
.inp:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,0.1);background:#fff;}
.lbl{display:block;font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.btn-primary{width:100%;padding:16px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:16px;font-weight:800;border:none;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 20px rgba(99,102,241,0.3);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(99,102,241,0.4);}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#1e293b;color:#fff;padding:14px 24px;border-radius:16px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;z-index:200;transition:all 0.4s;box-shadow:0 10px 40px rgba(0,0,0,0.15);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast i{color:#10b981;}
.toast.error i{color:#ef4444;}
</style>
</head>
<body class="flex items-center justify-center p-6">

  <!-- Toast Notification -->
  <div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toastMsg">Success</span></div>

  <div class="card">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#6366f1] to-[#8b5cf6] flex items-center justify-center shadow-lg shadow-indigo-200">
        <i class="fa-solid fa-user-plus text-white text-lg"></i>
      </div>
      <div>
        <h1 class="text-xl font-extrabold text-[#1e293b]">Admin Portal</h1>
        <p class="text-xs text-[#64748b] font-medium">Create a new user account</p>
      </div>
    </div>

    <form id="createUserForm" class="space-y-4">
      <div>
        <label class="lbl">Full Name</label>
        <input type="text" id="fullName" placeholder="John Doe" class="inp" required />
      </div>

      <div>
        <label class="lbl">Phone Number (11 Digits)</label>
        <input type="text" id="phone" placeholder="08012345678" class="inp" maxlength="11" required />
      </div>

      <div>
        <label class="lbl">Gmail Address</label>
        <input type="email" id="profileEmail" placeholder="johndoe@gmail.com" class="inp" required />
      </div>

      <div>
        <label class="lbl">Password (Min 6 Characters)</label>
        <input type="password" id="password" placeholder="••••••••" class="inp" minlength="6" required />
      </div>

      <div>
        <label class="lbl">Initial Account Balance (₦)</label>
        <input type="number" id="balance" placeholder="0.00" class="inp" value="0" required />
      </div>

      <div class="pt-3">
        <button type="submit" id="submitBtn" class="btn-primary">
          <span>Create User Account</span>
          <i class="fa-solid fa-arrow-right ml-2"></i>
        </button>
      </div>
    </form>
  </div>

  <script>
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      const msgEl = document.getElementById('toastMsg');
      const icon = t.querySelector('i');

      msgEl.textContent = msg;
      if (type === 'error') {
        icon.className = 'fa-solid fa-circle-xmark';
        icon.style.color = '#ef4444';
      } else {
        icon.className = 'fa-solid fa-circle-check';
        icon.style.color = '#10b981';
      }

      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    document.getElementById('createUserForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const profileEmail = document.getElementById('profileEmail').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();
      const balance = parseFloat(document.getElementById('balance').value) || 0;

      // Validation
      if (!/^\d{11}$/.test(phone)) {
        showToast('Phone number must be exactly 11 digits.', 'error');
        return;
      }
      if (!profileEmail.endsWith('@gmail.com')) {
        showToast('Must be a valid @gmail.com address.', 'error');
        return;
      }
      if (password.length < 6) {
        showToast('Password must be at least 6 characters long.', 'error');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Creating User...';

      const userData = {
        fullName,
        phone,
        profileEmail,
        password,
        balance,
        createdAt: new Date().toISOString()
      };

      try {
        let dbSaved = false;
        // Check if Firebase Firestore is available
        if (window._9jaCash && window._9jaCash.db) {
          const db = window._9jaCash.db;
          // Save document using phone number as the unique document ID
          await db.collection('users').doc(phone).set(userData);
          dbSaved = true;
        } else if (typeof firebase !== 'undefined' && firebase.apps.length) {
          const db = firebase.firestore();
          await db.collection('users').doc(phone).set(userData);
          dbSaved = true;
        }

        // Also save to localStorage as a backup / fallback
        localStorage.setItem('9jaCashUser', JSON.stringify(userData));

        showToast('User created successfully in database!');
        document.getElementById('createUserForm').reset();
      } catch (err) {
        console.error('Error creating user:', err);
        showToast('Failed to save user to database: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Create User Account</span><i class="fa-solid fa-arrow-right ml-2"></i>';
      }
    });
  </script>
</body>
</html>
